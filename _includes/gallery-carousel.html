{%- assign photos = include.photos -%}
{%- assign carousel_id = include.id | default: "gallery-carousel" -%}
{%- if photos and photos.size > 0 -%}
<div class="gallery-carousel-wrap">
  <button class="gallery-nav gallery-nav-prev" aria-label="Previous photo">&#10094;</button>

  <div class="gallery-carousel" id="{{ carousel_id }}">
    {%- for photo in photos -%}
    <div class="gallery-slide">
      <img src="{{ photo.image | relative_url }}" alt="{{ photo.caption | default: 'Gallery photo' }}">
      {%- if photo.caption -%}
      <p class="gallery-caption">{{ photo.caption }}</p>
      {%- endif -%}
    </div>
    {%- endfor -%}
  </div>

  <button class="gallery-nav gallery-nav-next" aria-label="Next photo">&#10095;</button>
</div>

<script>
  (function () {
    const carousel = document.getElementById('{{ carousel_id }}');
    if (!carousel) return;

    const wrap = carousel.closest('.gallery-carousel-wrap');
    const slides = Array.from(carousel.querySelectorAll('.gallery-slide'));
    const prevBtn = wrap.querySelector('.gallery-nav-prev');
    const nextBtn = wrap.querySelector('.gallery-nav-next');

    function updateActiveSlide() {
      const carouselCenter = carousel.scrollLeft + carousel.clientWidth / 2;
      let closest = null;
      let closestDist = Infinity;

      slides.forEach((slide) => {
        const slideCenter = slide.offsetLeft + slide.clientWidth / 2;
        const dist = Math.abs(slideCenter - carouselCenter);
        if (dist < closestDist) {
          closestDist = dist;
          closest = slide;
        }
      });

      slides.forEach((slide) => slide.classList.toggle('is-active', slide === closest));
    }

    function scrollToSlide(slide) {
      const target = slide.offsetLeft + slide.clientWidth / 2 - carousel.clientWidth / 2;
      carousel.scrollTo({ left: target, behavior: 'smooth' });
    }

    function goToOffset(offset) {
      const activeIndex = slides.findIndex((s) => s.classList.contains('is-active'));
      const nextIndex = Math.min(Math.max(activeIndex + offset, 0), slides.length - 1);
      scrollToSlide(slides[nextIndex]);
    }

    carousel.addEventListener('scroll', () => {
      window.requestAnimationFrame(updateActiveSlide);
    });

    prevBtn && prevBtn.addEventListener('click', () => goToOffset(-1));
    nextBtn && nextBtn.addEventListener('click', () => goToOffset(1));

    updateActiveSlide();
  })();
</script>
{%- endif -%}
