{%- assign photos = site.data.gallery -%}
{%- if photos and photos.size > 0 -%}
<div class="gallery-carousel-wrap">
  <button class="gallery-nav gallery-nav-prev" aria-label="Previous photo">&#10094;</button>

  <div class="gallery-carousel" id="gallery-carousel">
    {%- for photo in photos -%}
    <div class="gallery-slide">
      <img src="{{ photo.image | relative_url }}" alt="{{ photo.caption | default: 'Gallery photo' }}">
      {%- if photo.caption -%}
      <p class="gallery-caption">{{ photo.caption }}</p>
      {%- endif -%}
    </div>
    {%- endfor -%}
  </div>

  <button class="gallery-nav gallery-nav-next" aria-label="Next photo">&#10095;</button>
</div>

<style>
  .gallery-carousel-wrap {
    position: relative;
    display: flex;
    align-items: center;
    margin: 2rem 0;
  }

  .gallery-carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    gap: 1.5rem;
    padding: 2rem 15%;
    -webkit-overflow-scrolling: touch;
  }

  .gallery-carousel::-webkit-scrollbar {
    display: none;
  }

  .gallery-slide {
    flex: 0 0 auto;
    width: 75%;
    max-width: 800px;
    scroll-snap-align: center;
    text-align: center;
    transition: transform 0.3s ease, opacity 0.3s ease;
    transform: scale(0.75);
    opacity: 0.5;
  }

  .gallery-slide.is-active {
    transform: scale(1);
    opacity: 1;
  }

  .gallery-slide img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
  }

  .gallery-caption {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: #6c757d;
  }

  .gallery-nav {
    background: none;
    border: none;
    font-size: 1.5rem;
    color: #6c757d;
    cursor: pointer;
    padding: 0.5rem;
    z-index: 1;
  }

  .gallery-nav:hover {
    color: #007bff;
  }

  @media (max-width: 768px) {
    .gallery-carousel {
      padding: 1rem 10%;
    }

    .gallery-slide {
      width: 80%;
    }

    .gallery-nav {
      display: none;
    }
  }
</style>

<script>
  (function () {
    const carousel = document.getElementById('gallery-carousel');
    if (!carousel) return;

    const slides = Array.from(carousel.querySelectorAll('.gallery-slide'));
    const prevBtn = document.querySelector('.gallery-nav-prev');
    const nextBtn = document.querySelector('.gallery-nav-next');

    function updateActiveSlide() {
      const carouselCenter = carousel.scrollLeft + carousel.clientWidth / 2;
      let closest = null;
      let closestDist = Infinity;

      slides.forEach((slide) => {
        const slideCenter = slide.offsetLeft + slide.clientWidth / 2;
        const dist = Math.abs(slideCenter - carouselCenter);
        if (dist < closestDist) {
          closestDist = dist;
          closest = slide;
        }
      });

      slides.forEach((slide) => slide.classList.toggle('is-active', slide === closest));
    }

    function scrollToSlide(slide) {
      const target = slide.offsetLeft + slide.clientWidth / 2 - carousel.clientWidth / 2;
      carousel.scrollTo({ left: target, behavior: 'smooth' });
    }

    function goToOffset(offset) {
      const activeIndex = slides.findIndex((s) => s.classList.contains('is-active'));
      const nextIndex = Math.min(Math.max(activeIndex + offset, 0), slides.length - 1);
      scrollToSlide(slides[nextIndex]);
    }

    carousel.addEventListener('scroll', () => {
      window.requestAnimationFrame(updateActiveSlide);
    });

    prevBtn && prevBtn.addEventListener('click', () => goToOffset(-1));
    nextBtn && nextBtn.addEventListener('click', () => goToOffset(1));

    updateActiveSlide();
  })();
</script>
{%- endif -%}
